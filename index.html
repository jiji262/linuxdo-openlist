<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINUX DO OpenList — 社区开源推广项目聚合目录</title>
    <meta
      name="description"
      content="聚合收录 LINUX DO 社区 #开源推广 标签下的全部开源项目，支持按分类、标签、时间、热度极速检索，一键直达 GitHub 开源仓库与原帖讨论。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("openlist-theme");
          if (saved === "light") {
            document.documentElement.classList.remove("dark");
          } else if (saved === "dark") {
            document.documentElement.classList.add("dark");
          } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
